name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/unused
      DB_USERNAME: unused
      DB_PASSWORD: unused
      CASINO_OPERATOR_ID: '10000000'
      CASINO_HASH_KEY: ci-placeholder-signing-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Compile and package
        run: ./mvnw -B -DskipTests package
